services:
  db:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: announcement-db-dev
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - '6379:6379'
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    env_file:
      - .env.dev
    volumes:
      - ./:/node/app/
    depends_on:
      - db
    command: sh -c "yarn start:dev"

volumes:
  db_data:
  redis_data:
